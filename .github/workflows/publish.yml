name: Publish to NuGet

on:
  push:
    tags:
      - '*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = $Env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Error "No tag found in GITHUB_REF_NAME"
            exit 1
          }
          if ($tag.StartsWith('v')) {
            $tag = $tag.Substring(1)
          }
          if ($tag -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag must be a SemVer like 1.2.3 or v1.2.3. Got: $Env:GITHUB_REF_NAME"
            exit 1
          }
          echo "PACKAGE_VERSION=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV
          
      - name: Update project version
        shell: pwsh
        run: |
          $csproj = "Aria2NET/Aria2NET.csproj"
          [xml]$xml = Get-Content $csproj
          $group = $xml.Project.PropertyGroup | Select-Object -First 1
          if (-not $group) {
            $group = $xml.CreateElement("PropertyGroup")
            [void]$xml.Project.AppendChild($group)
          }
          function Set-Or-Create($name, $value) {
            $node = $group.$name
            if (-not $node) {
              $node = $xml.CreateElement($name)
              [void]$group.AppendChild($node)
            }
            $node.InnerText = $value
          }
          Set-Or-Create "Version" $Env:PACKAGE_VERSION
          Set-Or-Create "AssemblyVersion" $Env:PACKAGE_VERSION
          Set-Or-Create "FileVersion" $Env:PACKAGE_VERSION
          $xml.Save($csproj)

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore Aria2NET/Aria2NET.csproj

      - name: Build
        run: dotnet build Aria2NET/Aria2NET.csproj -c Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack Aria2NET/Aria2NET.csproj -c Release --no-build

      - name: Push to NuGet
        run: dotnet nuget push Aria2NET/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
